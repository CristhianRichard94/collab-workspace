<app-layout>
    <div class="container from-blue-50 bg-gradient-to-b to-blue-100 size-full flex flex-col justify-center">
        <div class="login-container flex flex-col justify-center items-center border-1 m-4 p-2 rounded-xl">
            <h1 class="text-3xl py-4">Login with google</h1>
            <p class="text-sm">Login to continue to your boards</p>
        <div>
                <div>
                    <div class="flex items-center rounded-md bg-white/5 my-2 pl-3 outline-1 -outline-offset-1 outline-gray-600 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-500">
                    <input id="username" type="text" name="price" placeholder="Username" class="block min-w-0 grow py-1.5 pr-3 pl-1 text-base placeholder:text-gray-500 focus:outline-none sm:text-sm/6" (change)="username.set($event.target.value)" />
                    </div>
                    <!-- <div class="flex items-center rounded-md bg-white/5 my-2 pl-3 outline-1 -outline-offset-1 outline-gray-600 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-500">
                    <input id="password" type="password" name="price" placeholder="Password" class="block min-w-0 grow py-1.5 pr-3 pl-1 text-base  placeholder:text-gray-500 focus:outline-none sm:text-sm/6" />
                    </div> -->
                </div>
            </div>
            <div class="button-container flex justify-around w-full">
                        <button class="px-4 py-2 bg-blue-600 text-white rounded cursor-pointer min-w-30" (click)="loginWithCreds()">Login</button>
                        <button class="px-4 py-2 bg-transparent border-black border-1 rounded cursor-pointer  min-w-30" routerLink="/">Cancel</button>
            </div>
            <!-- <div class="button-container flex justify-around w-full">
                        <button class="px-4 py-2 bg-blue-600 text-white rounded cursor-pointer min-w-30" (click)="loginWithGoogle()">Login with Google</button>
            </div> -->
        </div>
    </div>
</app-layout>
