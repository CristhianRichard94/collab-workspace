<app-layout>
  <div class="board flex flex-col size-full">
    @if (boardService.board$.isLoading()) {
      <app-board-skeleton />
    }
    @else if (boardService.board$.value(); as board) {
      <a routerLink="/boards" class="back-link flex items-center gap-1 w-fit" aria-label="Back to boards">
        &larr; Boards
      </a>
      <app-board-component
        (openInvite)="openInviteModal()"
        (editTask)="createOrEditTask($event.columnIndex, $event.task)"
      />
    }
  </div>
</app-layout>
<dialog id="task-form-dialog" aria-label="Task details" (cancel)="onDialogCancel($event, 'task-form')">
  <app-task-form [task]="editTask()" [columnIndex]="editTaskColumnIndex()" (closeModal)="closeModal()"></app-task-form>
</dialog>
<app-invite-dialog
  [boardId]="id()"
  (cancel)="onDialogCancel($event, 'invite')"
  (close)="closeInviteModal()"
/>
