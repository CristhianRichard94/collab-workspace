<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard placeholder preview</title>
  <desc id="desc">A generic skeleton preview image used as a placeholder thumbnail for a newly created dashboard with no data yet.</desc>

  <!-- background -->
  <rect x="0" y="0" width="800" height="450" fill="#F4F4F2"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#DEDEDA" stroke-width="1"/>

  <!-- top bar -->
  <rect x="24" y="24" width="140" height="14" rx="3" fill="#C9C9C3"/>
  <rect x="24" y="46" width="90" height="10" rx="3" fill="#DEDEDA"/>

  <circle cx="700" cy="31" r="14" fill="#E4E4DF"/>
  <circle cx="740" cy="31" r="14" fill="#E4E4DF"/>
  <circle cx="780" cy="31" r="14" fill="#E4E4DF"/>

  <!-- kpi cards row -->
  <g>
    <rect x="24" y="80" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
    <rect x="40" y="96" width="70" height="8" rx="2" fill="#DEDEDA"/>
    <rect x="40" y="114" width="100" height="14" rx="3" fill="#C9C9C3"/>
  </g>
  <g>
    <rect x="212" y="80" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
    <rect x="228" y="96" width="70" height="8" rx="2" fill="#DEDEDA"/>
    <rect x="228" y="114" width="100" height="14" rx="3" fill="#C9C9C3"/>
  </g>
  <g>
    <rect x="400" y="80" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
    <rect x="416" y="96" width="70" height="8" rx="2" fill="#DEDEDA"/>
    <rect x="416" y="114" width="100" height="14" rx="3" fill="#C9C9C3"/>
  </g>
  <g>
    <rect x="588" y="80" width="188" height="70" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
    <rect x="604" y="96" width="70" height="8" rx="2" fill="#DEDEDA"/>
    <rect x="604" y="114" width="100" height="14" rx="3" fill="#C9C9C3"/>
  </g>

  <!-- main chart card -->
  <rect x="24" y="170" width="464" height="256" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
  <rect x="44" y="190" width="120" height="10" rx="2" fill="#DEDEDA"/>

  <!-- bar chart skeleton -->
  <g fill="#E2E2DD">
    <rect x="44" y="330" width="34" height="66"/>
    <rect x="90" y="300" width="34" height="96"/>
    <rect x="136" y="340" width="34" height="56"/>
    <rect x="182" y="270" width="34" height="126"/>
    <rect x="228" y="310" width="34" height="86"/>
    <rect x="274" y="250" width="34" height="146"/>
    <rect x="320" y="290" width="34" height="106"/>
    <rect x="366" y="230" width="34" height="166"/>
    <rect x="412" y="280" width="34" height="116"/>
    <rect x="458" y="300" width="34" height="96"/>
  </g>
  <line x1="44" y1="396" x2="492" y2="396" stroke="#DEDEDA" stroke-width="1"/>

  <!-- side card: donut -->
  <rect x="504" y="170" width="272" height="122" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
  <rect x="524" y="190" width="100" height="10" rx="2" fill="#DEDEDA"/>
  <circle cx="580" cy="248" r="34" fill="none" stroke="#E2E2DD" stroke-width="14"/>
  <path d="M 580 214 A 34 34 0 0 1 611 260" fill="none" stroke="#C9C9C3" stroke-width="14"/>
  <rect x="636" y="228" width="90" height="8" rx="2" fill="#DEDEDA"/>
  <rect x="636" y="246" width="70" height="8" rx="2" fill="#E4E4DF"/>
  <rect x="636" y="264" width="80" height="8" rx="2" fill="#E4E4DF"/>

  <!-- side card: list -->
  <rect x="504" y="304" width="272" height="122" rx="8" fill="#FFFFFF" stroke="#E2E2DD" stroke-width="1"/>
  <rect x="524" y="324" width="100" height="10" rx="2" fill="#DEDEDA"/>
  <rect x="524" y="348" width="232" height="10" rx="2" fill="#E4E4DF"/>
  <rect x="524" y="368" width="200" height="10" rx="2" fill="#E4E4DF"/>
  <rect x="524" y="388" width="216" height="10" rx="2" fill="#E4E4DF"/>

  <!-- centered empty-state icon and label -->
  <g transform="translate(400,230)">
    <rect x="-28" y="-28" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#DEDEDA" stroke-width="1.5"/>
    <path d="M -12 8 L -12 -6 M -2 8 L -2 -14 M 8 8 L 8 0" stroke="#B7B7B0" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <text x="400" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8A8A82">New dashboard</text>
  <text x="400" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B7B7B0">Preview will appear once data is connected</text>
</svg>
